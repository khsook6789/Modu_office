services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: modu_office
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # 호스트 5433 → 컨테이너 5432 (로컬 PostgreSQL 5432와 충돌 방지)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d modu_office"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
