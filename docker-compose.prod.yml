services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modu_office}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=64MB
      -c work_mem=2MB
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB:-modu_office}"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - modu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-modu_office}?stringtype=unspecified
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      JAVA_OPTS: "-Xmx384m -Xms256m -XX:+UseSerialGC"
      DATA_SEEDING_ENABLED: ${DATA_SEEDING_ENABLED:-false}
      DATA_CLEAN_BEFORE_SEEDING: ${DATA_CLEAN_BEFORE_SEEDING:-false}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "127.0.0.1:8080:8080"  # Actuator 메트릭 수집용 (로컬호스트 한정)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - modu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ${NGINX_CONF:-./frontend/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - modu-network

networks:
  modu-network:
    driver: bridge

volumes:
  postgres_staging_data:
