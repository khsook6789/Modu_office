plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'
    id 'jacoco'
}

group = 'com.modu'
version = '0.0.1-SNAPSHOT'
description = 'Modu_office'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // Test & REST Docs
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger UI (OpenAPI 3 YAML 렌더링)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    implementation 'com.google.maps:google-maps-services:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Flyway (DB schema version management)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
}
tasks.named('test') {
	useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    finalizedBy jacocoTestReport
}

// plain jar 생성 방지 (Docker 빌드 시 충돌 방지 및 실행 파일 명확화)
jar {
    enabled = false
}

// Jacoco 커버리지 리포트 설정
jacoco {
    toolVersion = '0.8.10'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }
}

// REST Docs → OpenAPI 3 YAML 자동 생성 태스크
openapi3 {
    server = 'http://localhost:8080'
    title = 'Modu Office API'
    description = '모두의 오피스 통합 API 명세서'
    version = '1.0.0'
    format = 'yaml'
    outputDirectory = 'src/main/resources/static'
    outputFileNamePrefix = 'openapi3'
}

// openapi3.yaml 파일에 JWT 인증 설정(Authorize)을 주입하는 후처리 태스크
tasks.register('enhanceOpenApi') {
    dependsOn 'openapi3'
    doLast {
        def openapiFile = file("${projectDir}/src/main/resources/static/openapi3.yaml")
        if (!openapiFile.exists()) {
            openapiFile = file("${buildDir}/api-spec/openapi3.yaml")
        }
        
        if (openapiFile.exists()) {
            def content = openapiFile.getText('UTF-8').replace("\r\n", "\n")
            
            // 1. 전역 보안 요구사항 주입 (openapi: 3.0.1 바로 아래)
            if (!content.contains("security:")) {
                content = content.replace("openapi: 3.0.1", "openapi: 3.0.1\nsecurity:\n  - BearerAuth: []")
            }
            
            // 2. SecuritySchemes 주입 (components 섹션 도입부)
            if (!content.contains("securitySchemes:")) {
                def securitySchemes = "components:\n  securitySchemes:\n    BearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT"
                content = content.replace("components:", securitySchemes)
            }
            
            // 3. 트레일링 공백 및 개행 정리 (파서 오류 방지)
            content = content.split("\n").collect { it.stripTrailing() }.join("\n")
            
            openapiFile.setText(content, 'UTF-8')
            println "Successfully enhanced openapi3.yaml with robust Security Config."
        } else {
            throw new RuntimeException("Error: openapi3.yaml not found at any expected location.")
        }
    }
}

// openapi3 태스크가 끝나면 무조건 enhanceOpenApi 실행
tasks.matching { it.name == 'openapi3' }.configureEach {
    finalizedBy 'enhanceOpenApi'
}
