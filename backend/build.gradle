plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.modu'
version = '0.0.1-SNAPSHOT'
description = 'Modu_office'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // Test & REST Docs
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Swagger UI (OpenAPI 3 YAML 렌더링)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    implementation 'com.google.maps:google-maps-services:2.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Flyway (DB schema version management)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
}

tasks.named('test') {
    useJUnitPlatform()
}

// REST Docs → OpenAPI 3 YAML 자동 생성 태스크
openapi3 {
    server = 'http://localhost:8080'
    title = 'Modu Office API'
    description = '모두의 오피스 통합 API 명세서'
    version = '0.1.0'
    format = 'yaml'
    outputDirectory = 'src/main/resources/static'
    outputFileNamePrefix = 'openapi3'
}

// openapi3.yaml 파일에 JWT 인증 설정 및 에러 사전을 추가하는 후처리 태스크
tasks.register('enhanceOpenApi') {
    dependsOn 'openapi3'
    doLast {
        // 경로 확인 (openapi3 태스크 설정에 따라 다를 수 있음)
        def openapiFile = file("${projectDir}/src/main/resources/static/openapi3.yaml")
        if (!openapiFile.exists()) {
            openapiFile = file("${buildDir}/api-spec/openapi3.yaml")
        }
        
        if (openapiFile.exists()) {
            println "Enhancing OpenAPI spec at: ${openapiFile.absolutePath}"
            def content = openapiFile.getText('UTF-8')
            
            // 1. SecuritySchemes 추가
            if (!content.contains('securitySchemes:')) {
                if (content.contains('components:')) {
                    content = content.replace('components:', "components:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT")
                } else {
                    content += "\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT"
                }
            }
            
            // 2. 전역 보안 요구사항 추가
            if (!content.contains('security:')) {
                content += "\nsecurity:\n  - bearerAuth: []"
            }
            
            // 3. SWAGGER_TEST_GUIDE.md 주입 (YAML Block Scalar 방식)
            def guideFile = file("${projectDir}/../SWAGGER_TEST_GUIDE.md")
            println "Searching for guide file at: ${guideFile.absolutePath}"
            if (guideFile.exists()) {
                def guideContent = guideFile.getText("UTF-8")
                // 4칸 인벤팅 (Yaml format)
                def indentedGuide = guideContent.split("\n").collect { "    ${it}" }.join("\n")
                
                def lines = content.split("\n")
                def descriptionIndex = -1
                for (int i = 0; i < Math.min(30, lines.length); i++) {
                    if (lines[i].contains("description:") && (lines[i].contains("모두의") || lines[i].contains("통합"))) {
                        descriptionIndex = i
                        break
                    }
                }

                if (descriptionIndex != -1) {
                    println "Found description at line ${descriptionIndex + 1}, injecting guide..."
                    lines[descriptionIndex] = "  description: |\n" + indentedGuide
                    content = lines.join("\n")
                } else {
                    println "Warning: Targeted description line not found. Fallback to replaceFirst."
                    content = content.replaceFirst(/(?m)^[ ]*description: .*/, "  description: |\n" + indentedGuide)
                }
            }

            openapiFile.setText(content, 'UTF-8')
            println "Successfully enhanced openapi3.yaml (Size: ${content.length()} bytes)"
        } else {
            println "Error: openapi3.yaml not found at any expected location."
        }
    }
}

// openapi3 태스크가 끝나면 무조건 enhanceOpenApi 실행
tasks.matching { it.name == 'openapi3' }.configureEach {
    finalizedBy 'enhanceOpenApi'
}
