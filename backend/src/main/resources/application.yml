spring:
  profiles:
    active: local
  application:
    name: modu_office

  # 파일 업로드 표준 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # JSON 데이터 멱등성 확보 (필드 순서 고정)
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      order-map-entries-by-keys: true # Map 필드 알파벳 정렬
    mapper:
      sort-properties-alphabetically: true # 객체 필드 알파벳 정렬 강제

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
        "[default_batch_fetch_size]": 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          naver-user:
            provider: naver
            client-name: Naver (USER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-user"
            scope:
              - name
              - email
          naver-manager:
            provider: naver
            client-name: Naver (MANAGER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-manager"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# CORS 허용 Origin 설정 (환경별 profile에서 오버라이드 가능)
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
  jwt:
    access-token-expiration-milliseconds: 3600000 # 1 hour
    refresh-token-expiration-milliseconds: 604800000 # 7 days
  toss-payments:
    base-url: https://api.tosspayments.com

# Swagger / OpenAPI 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi3.yaml
    defaultModelsExpandDepth: -1
  api-docs:
    enabled: true # Swagger UI를 사용하기 위해 필수 (대신 자체 yaml 파일 주입)
