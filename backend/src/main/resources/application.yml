spring:
  application:
    name: modu_office
  profiles:
    active: local

  # 파일 업로드 표준 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # JSON 날짜 형식 표준화
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
        "[default_batch_fetch_size]": 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# CORS 허용 Origin 설정 (환경별 profile에서 오버라이드 가능)
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
  toss-payments:
    base-url: https://api.tosspayments.com
    secret-key: "test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6" # docs 테스트 키 쌍 (client key: test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm)
# Swagger / OpenAPI 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi3.yaml
    defaultModelsExpandDepth: -1
  api-docs:
    enabled: true # Swagger UI를 사용하기 위해 필수 (대신 자체 yaml 파일 주입)
