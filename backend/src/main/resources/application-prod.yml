spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/modu_office?stringtype=unspecified}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          naver-user:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
          naver-manager:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"  # Full Stack 모드용 CORS 허용
  jwt:
    secret: ${JWT_SECRET}
  toss-payments:
    secret-key: ${TOSS_SECRET_KEY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

logging:
  level:
    "[com.modu.office]": INFO
    "[org.hibernate.SQL]": WARN
