spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/modu_office?stringtype=unspecified}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      leak-detection-threshold: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          naver-user:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
          naver-manager:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 50

app:
  cors:
    allowed-origins:
      - "http://localhost"
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    redirect-uri: "http://localhost/oauth2/redirect"
  toss-payments:
    secret-key: ${TOSS_SECRET_KEY}
  data-seeding:
    enabled: ${DATA_SEEDING_ENABLED:false}
    clean-before-seeding: ${DATA_CLEAN_BEFORE_SEEDING:false}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[com.modu.office]": INFO
    "[org.hibernate.SQL]": WARN

sentry:
  dsn: ${SENTRY_DSN}
  environment: production
  enable-tracing: true
  traces-sample-rate: 1.0
  send-default-pii: false
