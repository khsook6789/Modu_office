spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Docker/배포 환경에서는 환경변수(${DB_URL}) 또는 컨테이너 서비스명(db)을 사용해야 합니다.
    # 예: jdbc:postgresql://modu-db:5432/modu_office
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modu_office}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 데이터 보존을 위해 validate 사용
    show-sql: false # 로그량 조절

  security:
    oauth2:
      client:
        registration:
          naver-user:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            # {baseUrl}은 현재 실행 중인 도메인으로 자동 치환됩니다. (도커/배포 시 유용)
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-user"
            authorization-grant-type: authorization_code
            scope: name,email
            client-name: Naver (USER)
          naver-manager:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-manager"
            authorization-grant-type: authorization_code
            scope: name,email
            client-name: Naver (MANAGER)

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-milliseconds: 3600000
    refresh-token-expiration-milliseconds: 604800000
  toss-payments:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

logging:
  level:
    "[com.modu.office]": INFO
    "[org.hibernate.SQL]": WARN
