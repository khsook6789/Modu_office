# ==========================================
# application-local.example.yml
# 로컬 개발 환경 설정 템플릿 (팀 공유용)
# 이 파일을 복사하여 'application-local.yml'을 생성하고,
# 실제 값({ ... })을 채워서 사용하세요.
# ==========================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/modu_office?stringtype=unspecified
    username: "{ postgres_username }"
    password: "{ postgres_password }"
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          naver-user:
            client-id: "{ naver_client_id }"
            client-secret: "{ naver_client_secret }"
          naver-manager:
            client-id: "{ naver_client_id }"
            client-secret: "{ naver_client_secret }"

app:
  jwt:
    secret: "{ jwt_secret_key_base64 }" # Base64 인코딩된 32바이트 이상 문자열
  toss-payments:
    secret-key: "{ toss_secret_key }" # 토스페이먼츠 시크릿 키

google:
  maps:
    api-key: "{ google_maps_api_key }"

logging:
  level:
    "[com.modu.office]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
