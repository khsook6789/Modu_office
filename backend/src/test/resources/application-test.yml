spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    mapping-resources:
      - META-INF/orm.xml
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  # OAuth2 더미 클라이언트 등록 (SecurityConfig의 oauth2Login이 ClientRegistrationRepository를 요구)
  security:
    oauth2:
      client:
        registration:
          naver-user:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (USER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-user"
            scope:
              - name
              - email
          naver-manager:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (MANAGER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-manager"
            scope:
              - name
              - email
# 테스트 시 컨텍스트 로딩 에러 방지를 위한 더미 설정 추가
app:
  jwt:
    secret: "dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS10ZXN0LXNlY3JldC1rZXktdGVzdC1zZWNyZXQta2V5"
    access-token-expiration-milliseconds: 3600000
    refresh-token-expiration-milliseconds: 604800000
  toss-payments:
    base-url: "https://api.tosspayments.com"
    secret-key: "test_sk_abc123"

google:
  maps:
    api-key: "test-api-key"

logging:
  level:
    "[com.modu.office]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
