spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  # OAuth2 더미 클라이언트 등록 (SecurityConfig의 oauth2Login이 ClientRegistrationRepository를 요구)
  security:
    oauth2:
      client:
        registration:
          naver-customer:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (Customer)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-customer"
            scope:
              - name
              - email
          naver-operator:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (Operator)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-operator"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# 테스트 시 컨텍스트 로딩 에러 방지를 위한 더미 설정 추가
app:
  jwt:
    secret: "dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS10ZXN0LXNlY3JldC1rZXktdGVzdC1zZWNyZXQta2V5"
    access-token-expiration-milliseconds: 3600000
    refresh-token-expiration-milliseconds: 604800000

google:
  maps:
    api-key: "test-api-key"

logging:
  level:
    "[com.modu.office]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
