spring:
  datasource:
    # @ServiceConnection(TestContainers)이 URL/username/password를 자동 주입
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false  # @DataJpaTest 기본값: Flyway 비활성 (IntegrationTestSupport에서 오버라이드)

  jpa:
    hibernate:
      ddl-auto: create-drop  # @DataJpaTest 기본값: Entity 기반 스키마 자동 생성
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # OAuth2 더미 클라이언트 등록 (SecurityConfig의 oauth2Login이 ClientRegistrationRepository를 요구)
  security:
    oauth2:
      client:
        registration:
          naver-user:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (USER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-user"
            scope:
              - name
              - email
          naver-manager:
            provider: naver
            client-id: test-client-id
            client-secret: test-client-secret
            client-name: Naver (MANAGER)
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver-manager"
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  jwt:
    secret: "dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS10ZXN0LXNlY3JldC1rZXktdGVzdC1zZWNyZXQta2V5"
    access-token-expiration-milliseconds: 3600000
    refresh-token-expiration-milliseconds: 604800000
  toss-payments:
    base-url: "https://api.tosspayments.com"
    secret-key: "test_sk_abc123"
  cors:
    allowed-origins:
      - "http://localhost:5173"

google:
  maps:
    api-key: "test-api-key"

logging:
  level:
    "[com.modu.office]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
